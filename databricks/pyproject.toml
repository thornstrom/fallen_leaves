[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fallen_leaves"
version = "0.1.0"
description = "ETL för analys av samband mellan temperatur och förseningar i SJ-trafiken"
requires-python = ">=3.10"
# pyspark, pandas och scipy finns redan i Databricks Runtime och listas därför bara som dev-beroenden.
dependencies = ["requests>=2.31"]

[project.optional-dependencies]
dev = [
  "pyspark==3.5.3",
  "pytest==8.3.3",
  "pandas==2.2.3",
  "numpy==2.1.3",
  "scipy==1.14.1",
]

[project.scripts]
fallen-leaves = "fallen_leaves.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
